# cop configuration
# Copy to /root/.config/cop/config.yaml and edit as needed (cop runs as root).
# All fields are optional — omitted fields use the built-in defaults.

general:
  data_dir: "~/.local/share/cop"       # baseline DB + alert log live here
  log_level: "INFO"                     # DEBUG / INFO / WARNING
  poll_interval_seconds: 30             # how often process + network monitors poll

alerts:
  dedup_window_seconds: 300             # hold back repeats of the same rule + subject (file, user, port...) within this window
  rule_cooldowns:                       # per-rule overrides (seconds)
    new_root_process: 600
    new_listen_port: 3600
    ssh_brute_force: 60
  retention_days: 90                    # delete alert history older than this (0 = keep forever)

ntfy:
  enabled: true
  url: "https://ntfy.sh/your-cop-topic"
  token: ""                             # set to Bearer token if topic is access-controlled
  timeout_seconds: 10

log_sink:
  enabled: true
  path: "~/.local/share/cop/alerts.jsonl"
  max_bytes: 10485760                   # 10 MB before rotation
  backup_count: 3

ollama:
  enabled: false                        # set true to score every alert via local Ollama
  url: "http://localhost:11434/api/generate"
  model: "qwen3:1.7b"
  timeout_seconds: 30                   # per-request timeout; alerts fire even if Ollama is slow
  history_count: 10                     # events fed to /assessment and used as scoring context
  min_risk: 5                           # suppress dispatch for alerts scored below this (0 = disabled)
  suppressed_comment_patterns:          # suppress dispatch if comment matches any pattern (case-insensitive regex)
    - "routine"
    - "legitimate"
    - "no malicious indicators"

telegram:
  enabled: false
  bot_token: ""                         # from @BotFather
  chat_id: ""                           # your personal or group chat ID
  allowed_user_ids: []                  # Telegram user IDs allowed to issue commands (empty = allow all)
  allowed_commands:                     # prefix whitelist for /exec
    - "docker stop"
    - "docker restart"
    - "systemctl stop"
    - "kill"
  confirm_destructive: true             # require "YES" before /exec runs

monitors:
  process:
    enabled: true
    # Shells spawned by these parents trigger CRITICAL suspicious_shell_spawn
    suspicious_parent_names:
      - caddy
      - python3
      - node
    shell_names:
      - bash
      - sh
      - zsh
      - dash
      - fish
    # Short-lived cron/daemon processes that won't be running during 'cop learn'
    ignored_process_names: []
    # Examples:
    #   - my-cron-job     # runs briefly at night
    #   - snapshotd       # btrfs snapshot daemon

  network:
    enabled: true
    # Ports to treat as always-known (never fire new_listen_port for these)
    baseline_ports_override: []
    # Loopback ports in the ephemeral range are client callbacks, not services
    ignore_loopback_ephemeral_ports: true
    # data_volume_anomaly: alert when *unexplained* outbound traffic (total minus
    # trusted containers and units below) stays over this many MB/min for
    # data_volume_sustained_seconds. One alert per episode.
    data_volume_threshold_mb: 100
    data_volume_sustained_seconds: 300
    # Also alert on unexplained inbound volume (data_volume_anomaly_recv)
    alert_on_inbound: false
    # Containers whose traffic is subtracted before checking data_volume_anomaly.
    # Read via `docker stats`; containers sharing a network namespace
    # (network_mode: service:X) are counted once. Only trust containers whose
    # traffic is mostly external: NetIO includes container-to-container traffic.
    trusted_docker_containers: []
    # Example:
    #   - gluetun    # VPN container; qbittorrent/prowlarr/bazarr share its netns here
    #   - jellyfin
    # systemd units whose traffic is subtracted too. Each needs IP accounting:
    #   sudo systemctl set-property <unit> IPAccounting=yes
    trusted_systemd_units: []
    # Example:
    #   - dropboxd@dropboxsync.service
    #   - tailscaled.service   # exit node / backups over Tailscale (tailscale0 itself isn't counted)

  file:
    enabled: true
    # watch_paths replaces the default list (~/.ssh, /root/.ssh, /etc, /home,
    # /var/run/docker.sock); extra_watch_paths adds to it. Prefer the extra_ lists.
    extra_watch_paths: []
      # - "/usr/local/sbin"
      # Avoid personal-file trees (e.g. a Dropbox folder): lots of noise, no security signal.
    ignore_patterns:                       # matched against filename only
      - "*.swp"
      - "*.tmp"
      - "*~"
      - "*.pyc"
    ignore_paths:                          # matched as path prefixes (full path)
      []
      # Examples:
      # - "/etc/cups"
    alert_on_events:
      - created
      - modified
      - deleted
      - moved
    # Writes to these fire CRITICAL instead of WARN, on top of the built-in list
    # (authorized_keys, passwd/shadow/group/gshadow, sudoers(.d), sshd_config(.d),
    # pam.d, ld.so.preload, profile.d, bash.bashrc, environment). Globs; * spans /.
    extra_critical_paths: []
      # - "/usr/local/sbin/*"
    # Skip non-critical events while apt/dpkg runs (PackageMonitor reports it)
    quiet_during_package_ops: true

  docker:
    enabled: true
    socket_path: "/var/run/docker.sock"
    # Containers expected to run — any other name on start fires WARN
    # Run 'cop baseline show --table containers' to see current containers
    known_containers: []
    restart_count_threshold: 3          # restarts within window before WARN
    restart_window_seconds: 300

  auth:
    enabled: true
    log_path: "/var/log/auth.log"
    brute_force_threshold: 5            # failures from same IP within window -> CRITICAL
    brute_force_window_seconds: 60
    # SSH logins from IPs outside these sources fire WARN ssh_unknown_source
    known_ssh_sources:
      - "100.64.0.0/10"                 # Tailscale
      - "127.0.0.1"
      # - "192.168.1.0/24"              # your LAN
    # SSH logins by these users fire CRITICAL ssh_login_outside_window unless
    # they match one of login_windows (UTC; hours are [start, end)).
    restricted_login_users: []
      # - root
    login_windows: []
      # - {user: root, source: "100.64.0.10", days: [sun], hours: [9, 14]}
    known_sudo_users:
      - root
      # - youruser

  tripwire:
    enabled: true
    # Honeypot files — any read access fires an immediate CRITICAL alert.
    # These should be files no legitimate process will ever open on your system.
    files:
      - "/root/.aws/credentials"        # AWS credential grab
      - "/root/.gnupg/secring.gpg"      # Legacy GPG private key (rarely exists)
      - "/root/.env"                     # App secrets — commonly grepped for, nothing reads it by default
      # Do NOT use "/root/.netrc" here: curl/wget/apt's HTTP fetch path probes
      # it on every request whether or not auth is needed, so it fires from
      # routine root-owned timers (apt-daily*, motd-news) — confirmed in
      # production, see README's TripwireMonitor section.
      # Other good candidates:
      # - "/root/.ssh/id_rsa"           # Only add if you don't actually use this key
      # - "/root/.docker/config.json"   # Docker Hub auth token
      # - "/var/www/html/wp-config.php" # WordPress DB credentials
      # Bait with believable fake contents (attackers love password.txt):
      # - path: "/home/youruser/password.txt"
      #   owner: youruser
      #   mode: "600"
      #   content: |
      #     passwords - move these into the password manager
      #     router admin   admin / (made-up)
    create_missing: true                # Create decoy files that don't already exist (empty unless content)
    # With monitors.exec enabled, opens are detected through auditd and name the
    # exact process and user. List legitimate readers (backups, indexers, Samba):
    allowed_readers: []
      # - "rsync@root"
      # - "smbd"

  package:
    enabled: true
    # One alert per apt/dpkg run: WARN if anything was installed or removed,
    # INFO (silent) if it only upgraded. A run ends after this long with no
    # dpkg activity; unattended-upgrades' back-to-back sessions become one run.
    summary_quiet_seconds: 60
    alert_on_install: true
    alert_on_remove: true
    ignored_packages: []

  exec:
    # Every program start, from auditd. Needs the execve rule in the README
    # (ExecMonitor → Setup) loaded with the key below.
    enabled: false
    audit_key: cop_exec
    # Internet-facing containers: a shell/downloader started by the app itself
    # is CRITICAL (container_suspicious_exec)
    public_containers: []
      # - my-reverse-proxy
      # - my-web-app
    temp_exec_allow: []   # globs of programs allowed to run from /tmp, /var/tmp, /dev/shm

  resource:
    enabled: true
    cpu_threshold_percent: 90.0         # per-process CPU % to trigger check
    cpu_sustained_seconds: 120          # must be sustained this long before alerting
    memory_threshold_percent: 85.0      # system-wide memory %
    net_alerts_enabled: false           # raw high_network_send/recv alerts (no subtraction)
    net_send_threshold_mbps: 50.0       # system-wide send rate
    net_recv_threshold_mbps: 100.0      # system-wide recv rate
    check_interval_seconds: 15
    resource_whitelist: []              # never alert on these process names
    # Examples:
    #   - dropbox
    #   - mybackupjob
